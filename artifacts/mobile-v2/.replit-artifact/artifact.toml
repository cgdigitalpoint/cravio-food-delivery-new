kind = "mobile"
previewPath = "/mobile-v2/"
title = "Cravio"
version = "1.0.0"
id = "artifacts/mobile-v2"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile-v2/" ]
localPort = 25590

[services.development]
run = "pnpm --filter @workspace/mobile-v2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-v2", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-v2", "run", "serve" ]

[services.env]
PORT = "25590"
BASE_PATH = "/mobile-v2/"
